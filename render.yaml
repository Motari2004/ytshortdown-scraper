services:
  - type: web
    name: ytshortdown-scraper
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 300 app:app
    envVars:
      - key: BROWSERLESS_API_TOKEN
        sync: false
      - key: SCRAPER_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9